name: Windows Build

on:
  workflow_dispatch: # 支持在 Actions 页面手动触发
  push:
    tags:
      - "v*" # 推送 v 开头的 tag 时自动构建

# 打 tag 构建时把安装包发布到 GitHub Release（Release 附件不计入 Actions 存储配额）
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.9
          channel: stable
          cache: true

      - name: Apply Win7-compatible engine (if present)
        shell: pwsh
        run: |
          # windows/win7/flutter_windows.dll 为社区 Win7 兼容引擎
          # （基于 Flutter 3.44.9 打补丁，同一 DLL 在 Win10/11 行为不变）。
          # 文件存在则替换引擎缓存，产物即可在 Win7 SP1（需 KB4474419 补丁）运行；
          # 不存在则跳过，按官方引擎出包。
          $dll = "windows/win7/flutter_windows.dll"
          if (Test-Path $dll) {
            $dst = Join-Path $env:FLUTTER_ROOT "bin\cache\artifacts\engine\windows-x64-release\flutter_windows.dll"
            Copy-Item $dll $dst -Force
            Write-Host "Win7 engine DLL applied -> $dst"
          } else {
            Write-Host "windows/win7/flutter_windows.dll not found, using stock engine"
          }

      - name: Pub get
        run: flutter pub get

      - name: Install ImageMagick
        shell: pwsh
        run: choco install imagemagick -y --no-progress

      - name: Replace app icon (png -> ico)
        shell: pwsh
        run: |
          $magick = (Get-ChildItem "C:\Program Files\ImageMagick*" -Filter magick.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1).FullName
          if (-not $magick) { $magick = "magick" }
          Write-Host "magick path: $magick"
          & $magick assets/app_icon.png -define icon:auto-resize=256,128,64,48,32,16 windows/runner/resources/app_icon.ico
          if ($LASTEXITCODE -ne 0) { Write-Error "magick failed"; exit 1 }
          Get-Item windows/runner/resources/app_icon.ico | Select-Object Length

      - name: Build Windows
        run: flutter build windows --release

      - name: Bundle VC++ runtime DLLs
        shell: pwsh
        run: |
          # Flutter Windows 产物依赖 VC++ 运行库（vcruntime140_1.dll 等），
          # 未装过 VC++ Redist 的全新系统会报"找不到 VCRUNTIME140_1.dll"。
          # v3.3.254 起固定用仓库内置的 14.29 运行库（windows/win7/vcruntime/，官方
          # VS2019 14.29.30157 x64 提取）：14.30+ 新版 msvcp140.dll 静态导入 Win8+ 的
          # GetSystemTimePreciseAsFileTime，Win7 加载即报"无法定位程序输入点"。
          # 仓库文件缺失时回退旧逻辑（VS Redist 目录 → System32）并打印警告。
          $rel = "build/windows/x64/runner/Release"
          $repo = "windows/win7/vcruntime"
          # 必需三件套（WenXun.exe/插件实际导入）；vcruntime140_threads.dll 是 14.4x 新增
          # 且应用不导入，仅为兼容旧打包习惯可选携带
          $need = @("msvcp140.dll","vcruntime140.dll","vcruntime140_1.dll")
          $missingRepo = $need | Where-Object { -not (Test-Path (Join-Path $repo $_)) }
          if (-not $missingRepo) {
            foreach ($dll in $need) {
              Copy-Item (Join-Path $repo $dll) $rel -Force
              $v = (Get-Item (Join-Path $rel $dll)).VersionInfo.FileVersion
              Write-Host "bundled $dll (repo, filever $v)"
            }
            # 安全闸：msvcp140 版本必须 < 14.30（否则 Win7 必挂）
            # 注意官方 DLL 的 FileVersion 形如 "14.29.30157.0 built by: cloudtest"，
            # 直接 [version] 强转会抛异常，先正则取前段数字
            $fvRaw = (Get-Item (Join-Path $rel "msvcp140.dll")).VersionInfo.FileVersion
            Write-Host "msvcp140 FileVersion raw: '$fvRaw'"
            if ($fvRaw -match '^\s*(\d+(?:\.\d+){1,3})') {
              $mv = [version]$matches[1]
              if ($mv -ge [version]"14.30") { Write-Error "msvcp140.dll $mv >= 14.30 breaks Windows 7"; exit 1 }
              Write-Host "msvcp140 version gate passed: $mv"
            } else {
              Write-Warning "无法解析 msvcp140 版本号，跳过版本闸门（仅打包，不阻断）"
            }
          } else {
            Write-Warning "Repo Win7 runtime incomplete ($missingRepo), fallback to system copy"
            $pats = @(
              "C:\Program Files\Microsoft Visual Studio\2022\*\VC\Redist\MSVC\*\x64\Microsoft.VC*.CRT",
              "C:\Program Files (x86)\Microsoft Visual Studio\2022\*\VC\Redist\MSVC\*\x64\Microsoft.VC*.CRT"
            )
            $src = $null
            foreach ($pat in $pats) {
              $hits = Get-ChildItem $pat -Directory -ErrorAction SilentlyContinue | Sort-Object FullName -Descending
              if ($hits) { $src = $hits[0].FullName; break }
            }
            if (-not $src) {
              Write-Host "VS Redist dir not found, listing candidates:"
              Get-ChildItem "C:\Program Files\Microsoft Visual Studio" -Directory -Recurse -Depth 4 -ErrorAction SilentlyContinue | Select-Object -First 30 -ExpandProperty FullName
              $need2 = @("msvcp140.dll","vcruntime140.dll","vcruntime140_1.dll")
              if (($need2 | Where-Object { -not (Test-Path (Join-Path "C:\Windows\System32" $_)) }).Count -eq 0) {
                $src = "C:\Windows\System32"
                Write-Host "Fallback to System32"
              }
            }
            if (-not $src) { Write-Error "No VC runtime source found"; exit 1 }
            Write-Host "CRT source: $src"
            foreach ($dll in $need) {
              $f = Join-Path $src $dll
              if (Test-Path $f) { Copy-Item $f $rel -Force; Write-Host "bundled $dll" }
              else { Write-Host "MISSING: $dll" }
            }
          }
          # vcruntime140_threads.dll 可选携带（仓库/系统里有就拷，没有不影响运行）
          foreach ($srcDir in @($repo, "C:\Windows\System32")) {
            $tf = Join-Path $srcDir "vcruntime140_threads.dll"
            if ((Test-Path $tf) -and (-not (Test-Path (Join-Path $rel "vcruntime140_threads.dll")))) {
              Copy-Item $tf $rel -Force
              Write-Host "bundled vcruntime140_threads.dll (optional, from $srcDir)"
              break
            }
          }
          Get-ChildItem "$rel/*.dll" | ForEach-Object { Write-Host ("{0}  {1}" -f $_.Name, $_.Length) }

      - name: Package portable (zip)
        shell: pwsh
        run: |
          Compress-Archive -Path "build/windows/x64/runner/Release/*" -DestinationPath "WenXun-portable.zip"

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $ver = ((Get-Content pubspec.yaml | Select-String '^version:').Line -split '\+')[0] -replace 'version:\s*',''
          Write-Host "AppVersion=$ver"
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc /DAppVersion=$ver windows\packaging\setup.iss

      - name: Release to GitHub Releases (tag build)
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $exe = (Get-ChildItem "build/installer/*.exe" | Select-Object -First 1).FullName
          if (-not $exe) { Write-Error "installer exe not found"; exit 1 }
          Write-Host "tag=$tag exe=$exe"
          gh release view $tag 2>$null; if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title $tag --generate-notes
          }
          gh release upload $tag $exe "WenXun-portable.zip" --clobber
          if ($LASTEXITCODE -ne 0) { Write-Error "release upload failed"; exit 1 }
          # 删 tag 重建会让旧 Release 变草稿（匿名下载看不到），这里强制转正式
          gh release edit $tag --draft=false

      # Artifacts 作为备用下载通道（保留 7 天）；存储配额满时上传失败不影响 Release
      - name: Upload portable zip
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: wenxun-windows-portable
          path: WenXun-portable.zip
          retention-days: 7

      - name: Upload installer
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: wenxun-windows-installer
          path: build/installer/*.exe
          retention-days: 7
