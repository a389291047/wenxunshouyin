name: Windows Build

on:
  workflow_dispatch: # 支持在 Actions 页面手动触发
  push:
    tags:
      - "v*" # 推送 v 开头的 tag 时自动构建

# 打 tag 构建时把安装包发布到 GitHub Release（Release 附件不计入 Actions 存储配额）
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.9
          channel: stable
          cache: true

      - name: Apply Win7-compatible engine (if present)
        shell: pwsh
        run: |
          # windows/win7/flutter_windows.dll 为社区 Win7 兼容引擎
          # （基于 Flutter 3.44.9 打补丁，同一 DLL 在 Win10/11 行为不变）。
          # 文件存在则替换引擎缓存，产物即可在 Win7 SP1（需 KB4474419 补丁）运行；
          # 不存在则跳过，按官方引擎出包。
          $dll = "windows/win7/flutter_windows.dll"
          if (Test-Path $dll) {
            $dst = Join-Path $env:FLUTTER_ROOT "bin\cache\artifacts\engine\windows-x64-release\flutter_windows.dll"
            Copy-Item $dll $dst -Force
            Write-Host "Win7 engine DLL applied -> $dst"
          } else {
            Write-Host "windows/win7/flutter_windows.dll not found, using stock engine"
          }

      - name: Pub get
        run: flutter pub get

      - name: Install ImageMagick
        shell: pwsh
        run: choco install imagemagick -y --no-progress

      - name: Replace app icon (png -> ico)
        shell: pwsh
        run: |
          $magick = (Get-ChildItem "C:\Program Files\ImageMagick*" -Filter magick.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1).FullName
          if (-not $magick) { $magick = "magick" }
          Write-Host "magick path: $magick"
          & $magick assets/app_icon.png -define icon:auto-resize=256,128,64,48,32,16 windows/runner/resources/app_icon.ico
          if ($LASTEXITCODE -ne 0) { Write-Error "magick failed"; exit 1 }
          Get-Item windows/runner/resources/app_icon.ico | Select-Object Length

      - name: Build Windows
        run: flutter build windows --release

      - name: Bundle VC++ runtime DLLs
        shell: pwsh
        run: |
          # Flutter Windows 产物依赖 VC++ 运行库（vcruntime140_1.dll 等），
          # 未装过 VC++ Redist 的全新系统会报"找不到 VCRUNTIME140_1.dll"。
          # 从 Runner 自带 VS2022 的官方 Redist 目录拷贝，随安装包分发。
          $dirs = Get-ChildItem "C:\Program Files\Microsoft Visual Studio\2022\*\VC\Redist\MSVC\*\x64\Microsoft.VC*.CRT" -Directory -ErrorAction SilentlyContinue |
            Sort-Object FullName -Descending
          if (-not $dirs) { Write-Error "VC Redist CRT directory not found"; exit 1 }
          $src = $dirs[0].FullName
          Write-Host "CRT source: $src"
          foreach ($dll in "msvcp140.dll","vcruntime140.dll","vcruntime140_1.dll","vcruntime140_threads.dll") {
            $f = Join-Path $src $dll
            if (Test-Path $f) { Copy-Item $f "build/windows/x64/runner/Release/" -Force; Write-Host "bundled $dll" }
          }
          Get-ChildItem "build/windows/x64/runner/Release/*.dll" | Select-Object Name, Length

      - name: Package portable (zip)
        shell: pwsh
        run: |
          Compress-Archive -Path "build/windows/x64/runner/Release/*" -DestinationPath "WenXun-portable.zip"

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $ver = ((Get-Content pubspec.yaml | Select-String '^version:').Line -split '\+')[0] -replace 'version:\s*',''
          Write-Host "AppVersion=$ver"
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc /DAppVersion=$ver windows\packaging\setup.iss

      - name: Release to GitHub Releases (tag build)
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $exe = (Get-ChildItem "build/installer/*.exe" | Select-Object -First 1).FullName
          if (-not $exe) { Write-Error "installer exe not found"; exit 1 }
          Write-Host "tag=$tag exe=$exe"
          gh release view $tag 2>$null; if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title $tag --generate-notes
          }
          gh release upload $tag $exe "WenXun-portable.zip" --clobber
          if ($LASTEXITCODE -ne 0) { Write-Error "release upload failed"; exit 1 }

      # Artifacts 作为备用下载通道（保留 7 天）；存储配额满时上传失败不影响 Release
      - name: Upload portable zip
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: wenxun-windows-portable
          path: WenXun-portable.zip
          retention-days: 7

      - name: Upload installer
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: wenxun-windows-installer
          path: build/installer/*.exe
          retention-days: 7
