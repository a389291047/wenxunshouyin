name: Windows Build

on:
  workflow_dispatch: # 支持在 Actions 页面手动触发
  push:
    tags:
      - "v*" # 推送 v 开头的 tag 时自动构建

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.8
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Replace app icon (png -> ico)
        shell: pwsh
        run: |
          choco install imagemagick -y --no-progress
          Import-Module $env:ProgramData\chocolatey\helpers\chocolateyProfile.psm1
          refreshenv
          magick assets/app_icon.png -define icon:auto-resize=256,128,64,48,32,16 windows/runner/resources/app_icon.ico

      - name: Build Windows
        run: flutter build windows --release

      - name: Package portable (zip)
        shell: pwsh
        run: |
          Compress-Archive -Path "build/windows/x64/runner/Release/*" -DestinationPath "WenXun-portable.zip"

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $ver = ((Get-Content pubspec.yaml | Select-String '^version:').Line -split '\+')[0] -replace 'version:\s*',''
          Write-Host "AppVersion=$ver"
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc /DAppVersion=$ver windows\packaging\setup.iss

      - name: Upload portable zip
        uses: actions/upload-artifact@v4
        with:
          name: wenxun-windows-portable
          path: WenXun-portable.zip
          retention-days: 30

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: wenxun-windows-installer
          path: build/installer/*.exe
          retention-days: 30
