name: wenxun
version: 3.3.40+3340

environment:
  sdk: '^3.13.0'
  flutter: '^3.47.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_slidable: ^3.0.1
  http: ^1.1.0
  cupertino_icons: ^1.0.6
  audioplayers: ^6.1.0
  path_provider: ^2.1.0
  provider: ^6.1.1
  shared_preferences: ^2.2.2
  window_manager: ^0.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  intl: ^0.19.0
  flutter_launcher_icons: ^0.14.3  # 最新版

flutter:
  uses-material-design: true
  assets:
    - assets/wenxun.png
    - assets/kefu.png
    - assets/bj.png
    - assets/app_icon.png  # 你的图标
    - assets/avatar_default.png  # 会员默认头像
    - assets/kefu_qr.png  # 微信客服二维码（企业微信客服）

# ==========================================
# ✅  flutter_launcher_icons 自动圆角图标
# ==========================================
flutter_launcher_icons:
  image_path: "assets/app_icon.png"  # 你的正方形图标
  macos:
    generate: true
    image_path: "assets/app_icon.png"  # 你的正方形图标